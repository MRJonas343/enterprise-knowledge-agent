# Continuous integration for the Enterprise Knowledge Agent.
#
# Three independent jobs, so a failure names the layer that broke:
#   * python    - install uv, `uv sync --frozen`, then pytest
#   * frontend  - install Node, `npm ci`, then eslint, vitest and a build
#   * terraform - `fmt -check`, `init -backend=false`, then `validate`
#
# What this workflow does NOT cover, deliberately:
#   * There is no `terraform plan` gate. Planning needs the Terraform state, and
#     the state is local: it lives in one git-ignored file on the operator's
#     machine. CI has no state, so a plan here would propose creating every
#     resource from scratch, which is worse than no plan at all. Planning stays a
#     local step. Do not read a green run as "the plan is safe".
#   * No deployment, no environment promotion and no artifact provenance.
#     Nothing is packaged or deployed, so there is nothing to promote, approve
#     or trace back to a commit.
#   * No evaluation or grounding probes: those need live Azure.
#   * The workflow only reads the repository. It holds no secrets and writes
#     nothing back, so `permissions` stays at `contents: read`.
#
# Action tags are pinned deliberately. `astral-sh/setup-uv` stopped publishing
# moving major tags at v8.0.0 as a supply-chain measure, so `@v10` does not
# exist; it is pinned to the immutable release tag instead.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Run the test suite
        run: uv run pytest -q

  frontend:
    name: Frontend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run the test suite
        run: npm test

      - name: Build
        run: npm run build

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without a backend
        run: terraform init -backend=false

      - name: Validate the configuration
        run: terraform validate
